name: Deploy site institucional

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Enviar site/ para a Hostinger via FTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ATENÇÃO: o root deste usuário FTP é o PRÓPRIO docroot do site
      # (public_html) — por isso server-dir: ./ . Com "public_html/" aqui,
      # o deploy cria uma subpasta public_html DENTRO do docroot (aconteceu
      # em 2026-08-06 quando o root do usuário FTP mudou no hPanel).
      - name: Sincronizar site/ com o docroot
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SITE_FTP_HOST }}
          username: ${{ secrets.SITE_FTP_USER }}
          password: ${{ secrets.SITE_FTP_PASSWORD }}
          protocol: ftps
          local-dir: site/
          server-dir: ./
          exclude: |
            DEPLOY.md
            **/.git*
            **/.git*/**
          # O crm/ é publicado pelo workflow proprio (deploy-crm.yml) com
          # state file separado; este deploy nunca o remove.
