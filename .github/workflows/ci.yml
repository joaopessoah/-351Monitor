# =============================================================================
# +351 Monitor — CI/CD (F0)
# backend (build+test com gate de isolamento multi-tenant) → portal (build)
# → docker (build + push das imagens no GHCR: tags sha-<sha> e staging)
# → deploy-staging (SSH; skip com aviso se secrets ausentes)
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (build + test + gate de isolamento)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m351_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d m351_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Connection string dos testes de integração (Testcontainers indisponível →
      # service container; o gate de isolamento multi-tenant roda AQUI).
      M351_TEST_PG: Host=localhost;Port=5432;Database=m351_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/M351.sln

      - name: Build
        run: dotnet build backend/M351.sln -c Release --no-restore

      - name: Test (inclui gate de isolamento multi-tenant)
        run: dotnet test backend/M351.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Pacotes vulneráveis (gate 11.1.3 — sem críticos)
        run: |
          dotnet list backend/M351.sln package --vulnerable --include-transitive | tee vulneraveis.txt
          if grep -qiE '\bcritical\b' vulneraveis.txt; then
            echo "::error::Pacote com vulnerabilidade CRÍTICA encontrado — corrija antes do merge."
            exit 1
          fi

  portal:
    name: portal (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: docker (build + push GHCR)
    needs: [backend, portal]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige owner em minúsculas (github.repository_owner pode ter maiúsculas)
      - name: Derivar owner em minúsculas
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      # Push de duas tags por imagem: sha-<sha> (imutável, serve de alvo de rollback
      # via IMAGE_TAG no deploy) e staging (móvel, o que o compose puxa por padrão).
      - name: Build + push imagem api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/m351-api:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/m351-api:staging
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build + push imagem worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/m351-worker:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/m351-worker:staging
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  agent-msi:
    name: agent-msi (build do instalador WiX)
    # Independente dos demais jobs (sem needs): roda em todo push/PR e publica o MSI como artifact.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # WiX v5 fixo: o v6/v7 exige aceite da EULA OSMF (Open Source Maintenance Fee) e trava o build.
      WIX_VERSION: "5.0.2"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes do agente
        run: dotnet test agent/M351.Agent.sln --configuration Release

      - name: Instalar WiX v5 (dotnet tool) + extensao Util
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          # Garante que o tool global esta no PATH desta etapa e das seguintes.
          $toolsPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          echo $toolsPath | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$toolsPath\wix.exe" extension add --global WixToolset.Util.wixext/$env:WIX_VERSION

      - name: Build do MSI (publica os 2 exes + wix build; code signing pulado na F5)
        shell: pwsh
        run: agent/installer/build-agent-msi.ps1

      - name: Upload do MonitorAgent.msi como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorAgent-msi
          path: agent/installer/bin/MonitorAgent.msi
          if-no-files-found: error
          # MSI de 85MB por push contra 500MB de cota total de artifacts do plano free:
          # com 90d de retencao default a cota estourou em ago/2026 e TODO upload passou
          # a falhar. 1 dia e suficiente para baixar o build do dia; cada commit rebuilda.
          retention-days: 1

  deploy-staging:
    name: deploy-staging (SSH)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy em staging (skip se secrets ausentes)
        run: |
          if [ -z "${STAGING_SSH_HOST}" ] || [ -z "${STAGING_SSH_KEY}" ]; then
            echo "::warning::skipping: secrets ausentes (STAGING_SSH_HOST/STAGING_SSH_KEY) — deploy de staging não executado"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${STAGING_SSH_KEY}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          export SSH_KEY_FILE="$HOME/.ssh/staging_key"
          export STAGING_SSH_USER="${STAGING_SSH_USER:-deploy}"
          bash infra/scripts/deploy-staging.sh
