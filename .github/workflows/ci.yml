# =============================================================================
# +351 Monitor — CI/CD (F0)
# backend (build+test com gate de isolamento multi-tenant) → portal (build)
# → docker (build das imagens, sem push de registry por enquanto)
# → deploy-staging (SSH; skip com aviso se secrets ausentes)
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (build + test + gate de isolamento)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m351_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d m351_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Connection string dos testes de integração (Testcontainers indisponível →
      # service container; o gate de isolamento multi-tenant roda AQUI).
      M351_TEST_PG: Host=localhost;Port=5432;Database=m351_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/M351.sln

      - name: Build
        run: dotnet build backend/M351.sln -c Release --no-restore

      - name: Test (inclui gate de isolamento multi-tenant)
        run: dotnet test backend/M351.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Pacotes vulneráveis (gate 11.1.3 — sem críticos)
        run: |
          dotnet list backend/M351.sln package --vulnerable --include-transitive | tee vulneraveis.txt
          if grep -qiE '\bcritical\b|\bcrítico\b' vulneraveis.txt; then
            echo "::error::Pacote com vulnerabilidade CRÍTICA encontrado — corrija antes do merge."
            exit 1
          fi

  portal:
    name: portal (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: docker (build das imagens)
    needs: [backend, portal]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      # Sem push de registry por enquanto (GHCR é etapa futura) — o build
      # garante que as imagens de api e worker são construíveis a cada main.
      - name: Build imagem api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: m351/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build imagem worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: false
          tags: m351/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy-staging:
    name: deploy-staging (SSH)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy em staging (skip se secrets ausentes)
        run: |
          if [ -z "${STAGING_SSH_HOST}" ] || [ -z "${STAGING_SSH_KEY}" ]; then
            echo "::warning::skipping: secrets ausentes (STAGING_SSH_HOST/STAGING_SSH_KEY) — deploy de staging não executado"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${STAGING_SSH_KEY}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          export SSH_KEY_FILE="$HOME/.ssh/staging_key"
          export STAGING_SSH_USER="${STAGING_SSH_USER:-deploy}"
          bash infra/scripts/deploy-staging.sh
